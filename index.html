<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Turnpage Digital Markets — The OTC Desk for Rights Holders</title>
    <meta name="description" content="Capital and advisory for individuals and institutions with claims to compensation — across the largest AI copyright class actions, crypto bankruptcies, and complex litigation in the world. Over $1 billion in claims liquidated." />
    <meta name="author" content="Turnpage Digital Markets" />
    <link rel="canonical" href="https://turnpagedigital.com" />

    <!-- Open Graph
         NOTE: og:* and twitter:* tags are rewritten per-path at request time
         by functions/_middleware.js (Cloudflare Pages HTMLRewriter). The values
         below are defaults for the homepage and any non-listed path. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://turnpagedigital.com/" />
    <meta property="og:title" content="Turnpage Digital Markets — The OTC Desk for Rights Holders" />
    <meta property="og:description" content="Capital and advisory for rights holders. AI copyright class actions, crypto bankruptcies, complex litigation — over $1B liquidated." />
    <meta property="og:image" content="https://turnpagedigital.com/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Turnpage Digital Markets" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turnpage Digital Markets — The OTC Desk for Rights Holders" />
    <meta name="twitter:description" content="Capital and advisory for rights holders. AI copyright class actions, crypto bankruptcies, complex litigation — over $1B liquidated." />
    <meta name="twitter:image" content="https://turnpagedigital.com/og/home.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon1.png" />
    <link rel="apple-touch-icon" href="/favicon1.png" />

    <!-- Structured data: sitewide Organization + WebSite.
         Per-briefing NewsArticle/Breadcrumb and /faq FAQPage JSON-LD are
         injected per-path by functions/_middleware.js. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Turnpage Digital Markets",
      "url": "https://turnpagedigital.com",
      "logo": "https://turnpagedigital.com/og/home",
      "description": "The OTC desk for rights holders — capital and advisory across AI copyright class actions, crypto bankruptcies, and complex litigation.",
      "email": "info@turnpagedigital.com",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "info@turnpagedigital.com",
        "url": "https://turnpagedigital.com/contact"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Turnpage Digital Markets",
      "url": "https://turnpagedigital.com"
    }
    </script>

    <!-- Cloudflare Turnstile (bot protection on contact form) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
