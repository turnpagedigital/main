name: Daily Briefing Generation

on:
  schedule:
    # 14:00 UTC = 10:00 AM ET during DST (Mar-Nov), 9:00 AM ET in standard time
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Override briefing date (YYYY-MM-DD, optional)"
        required: false
        default: ""
      topics:
        description: "Run only these topic slugs, comma-separated (e.g. crypto-insolvency). Empty = all topics."
        required: false
        default: ""
  # Fired by the admin's "Run Now" button via POST /repos/{repo}/dispatches —
  # works with a fine-grained token that has Contents: write (no Actions
  # permission needed, unlike workflow_dispatch).
  repository_dispatch:
    types: [daily-briefing]

permissions:
  contents: write  # commit + push generated briefing files back to the repo

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # web-search verification adds a few minutes per topic

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: briefing-generator/scripts/requirements.txt

      - name: Install dependencies
        working-directory: briefing-generator
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run daily briefing generation
        working-directory: briefing-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: free CourtListener API token enables live docket pulls.
          # Without it, the seeded case JSON renders unchanged.
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          BRIEFING_DATE: ${{ github.event.inputs.date || '' }}
          # Single-topic mode: comma-separated slugs from the manual-run form
          # or the admin "Run Now" dispatch payload. Empty = run all topics.
          BRIEFING_TOPICS: ${{ github.event.inputs.topics || github.event.client_payload.topics || '' }}
        run: |
          python scripts/generate.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Daily Briefing Bot"
          git add briefing-generator
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "Daily briefing ${DATE}"
            # Rebase-and-push with retries: another run or a deploy may have
            # advanced main between checkout and push — a bare push then fails
            # ("fetch first"), silently dropping the day's briefing.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "pushed to main on attempt ${attempt}"; break
              fi
              echo "main push attempt ${attempt} failed; retrying in 5s"; sleep 5
            done
          fi

      # ── Deliver to the dev branch (intel dashboards + site queue) ────────
      # The dev site is what the admin's "output home" links point to, so it
      # needs the fresh intel dashboards too — not just main/production. We
      # also queue today's advisories as DRAFT posts for the Briefings tab
      # (idempotent — existing slugs skipped). This commit DOES rebuild dev
      # (no [skip ci]) so /intel/<slug> on dev serves the new dashboards.
      - name: Checkout dev branch (intel + site queue)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy fresh intel dashboards into dev
        run: |
          # Copy ONLY generated artifacts (dashboards, advisories, posts,
          # landing) — never scripts/cases/config, so dev keeps its own
          # pipeline code (which may be ahead of main).
          cp -f briefing-generator/index.html dev-site/briefing-generator/index.html 2>/dev/null || true
          cp -f briefing-generator/briefings.json dev-site/briefing-generator/briefings.json 2>/dev/null || true
          for slug in rewind-tariffs llm-class-action crypto-insolvency fraud-recovery billion-dollar-class-actions bankruptcy-creditor-rights; do
            d="dev-site/briefing-generator/$slug"
            mkdir -p "$d/public" "$d/posts"
            cp -f "briefing-generator/$slug/dashboard.html" "$d/dashboard.html" 2>/dev/null || true
            cp -f "briefing-generator/$slug/posts.html"     "$d/posts.html"     2>/dev/null || true
            cp -f briefing-generator/$slug/public/advisory-*.md "$d/public/" 2>/dev/null || true
            cp -f briefing-generator/$slug/posts/*.md           "$d/posts/"   2>/dev/null || true
          done

      - name: Queue site briefing drafts
        run: |
          DATE=${BRIEFING_DATE:-$(date -u +"%Y-%m-%d")}
          python briefing-generator/scripts/queue_site_drafts.py \
            --source briefing-generator --target dev-site --date "$DATE"
        env:
          BRIEFING_DATE: ${{ github.event.inputs.date || '' }}

      - name: Commit intel dashboards + queued drafts to dev
        working-directory: dev-site
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Daily Briefing Bot"
          git add briefing-generator public/briefings
          if git diff --staged --quiet; then
            echo "Nothing new for dev"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "Daily briefing ${DATE}: refresh dev intel dashboards + queue drafts"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin dev && git push origin HEAD:dev; then
                echo "pushed to dev on attempt ${attempt}"; break
              fi
              echo "dev push attempt ${attempt} failed; retrying in 5s"; sleep 5
            done
          fi
