name: Daily Briefing Generation
# Single-case runs (admin "Brief now" / manual form) carry their slug so
# /api/admin/sync-status can match them; scheduled runs keep the default.
run-name: "${{ (inputs.case || github.event.client_payload.case) && format('Briefing — {0}', inputs.case || github.event.client_payload.case) || '' }}"

on:
  schedule:
    # 14:00 UTC = 10:00 AM ET during DST (Mar-Nov), 9:00 AM ET in standard time.
    # Weekdays only (Mon-Fri) — unscoped runs only auto-brief cases starred
    # ⭐ high-priority on the intel dashboard (see generate_case_briefings.py
    # load_priorities()). Everything else runs via the admin Run Now / Brief
    # now button, which passes `case` below and bypasses the priority gate.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: "Override briefing date (YYYY-MM-DD, optional)"
        required: false
        default: ""
      case:
        description: "Run only these case slugs, comma-separated (e.g. bartz-anthropic,poolin). Empty = only cases starred ⭐ high priority."
        required: false
        default: ""
      force:
        description: "Regenerate even when the activity signature is unchanged (true/false)"
        required: false
        default: "false"
  # Fired by the admin's "Run Now" button via POST /repos/{repo}/dispatches —
  # works with a fine-grained token that has Contents: write (no Actions
  # permission needed, unlike workflow_dispatch).
  repository_dispatch:
    types: [daily-briefing]

permissions:
  contents: write  # commit + push generated briefing files back to the repo

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # web-search verification adds a few minutes per topic

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: briefing-generator/scripts/requirements.txt

      - name: Install dependencies
        working-directory: briefing-generator
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run daily case briefings
        working-directory: briefing-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: CourtListener API token enables live docket pulls.
          # Without it, the seeded case JSON renders unchanged.
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          BRIEFING_DATE: ${{ github.event.inputs.date || '' }}
          # Single-case mode from the manual-run form or the admin "Run Now"
          # dispatch payload. Empty = every tracked case.
          BRIEFING_CASE: ${{ github.event.inputs.case || github.event.client_payload.case || '' }}
          BRIEFING_FORCE: ${{ (github.event.inputs.force == 'true' || github.event.client_payload.force == true) && '1' || '' }}
          # Single-case runs skip the full 20-docket refresh — sync just the
          # requested case (a group id matches nothing and skips the fetch
          # entirely; member dockets are ≤1h old from the hourly sync). This
          # is what makes the dashboard "Brief now" take ~2 min instead of ~8.
          DOCKET_ONLY_CASE: ${{ github.event.inputs.case || github.event.client_payload.case || '' }}
          # Optional: X API bearer (read tier) — followed accounts feed briefings
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # Cases-not-themes (Aug 2026): fresh dockets first, then one
          # 24h-delta briefing per case that moved, then the unified pages.
          python scripts/scan_x.py
          python scripts/fetch_dockets.py
          python scripts/generate_case_briefings.py
          python scripts/inject_cases.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Daily Briefing Bot"
          git add briefing-generator
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "Daily briefing ${DATE}"
            # Rebase-and-push with retries: another run or a deploy may have
            # advanced main between checkout and push — a bare push then fails
            # ("fetch first"), silently dropping the day's briefing.
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "pushed to main on attempt ${attempt}"; break
              fi
              git rebase --abort 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              echo "main push attempt ${attempt} failed; retrying in 5s"; sleep 5
            done
          fi

      # ── Deliver to the dev branch (per-case briefings + unified pages) ───
      # The dev site is what the admin's "output home" links point to, so it
      # needs the fresh intel artifacts too — not just main/production. This
      # commit DOES rebuild dev (no [skip ci]) so /intel on dev serves them.
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy fresh intel artifacts into dev
        run: |
          # Copy ONLY generated artifacts — never scripts/config, so dev
          # keeps its own pipeline code (which may be ahead of main).
          mkdir -p dev-site/briefing-generator/cases/data
          cp -f briefing-generator/index.html dev-site/briefing-generator/index.html 2>/dev/null || true
          cp -f briefing-generator/case-briefings.json dev-site/briefing-generator/case-briefings.json 2>/dev/null || true
          cp -f briefing-generator/briefing-groups.json dev-site/briefing-generator/briefing-groups.json 2>/dev/null || true
          mkdir -p dev-site/briefing-generator/case-briefings
          cp -f briefing-generator/case-briefings/*.json dev-site/briefing-generator/case-briefings/ 2>/dev/null || true
          cp -f briefing-generator/cases/data/*.json dev-site/briefing-generator/cases/data/ 2>/dev/null || true
          cp -f briefing-generator/cases/*.html dev-site/briefing-generator/cases/ 2>/dev/null || true
          for page in docket.html calendar.html news.html notes.html; do
            cp -f "briefing-generator/$page" "dev-site/briefing-generator/$page" 2>/dev/null || true
          done

      - name: Commit intel artifacts to dev
        working-directory: dev-site
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Daily Briefing Bot"
          git add briefing-generator
          if git diff --staged --quiet; then
            echo "Nothing new for dev"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "Daily briefing ${DATE}: refresh dev case briefings"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin dev && git push origin HEAD:dev; then
                echo "pushed to dev on attempt ${attempt}"; break
              fi
              git rebase --abort 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              echo "dev push attempt ${attempt} failed; retrying in 5s"; sleep 5
            done
          fi
