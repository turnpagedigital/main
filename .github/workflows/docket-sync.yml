name: Docket Sync
# Scheduled runs keep the default title; a single-case dispatch (admin
# Sync-now) carries its slug so /api/admin/sync-status can match it.
run-name: "${{ inputs.case && format('Docket sync — {0}', inputs.case) || '' }}"

# Keeps the tracked-case docket data fresh when nobody has the page open.
# (While the page IS open it self-refreshes every minute via
# /intel/api/dockets — this cron is the "not loaded" half.)
#
# Pulls CourtListener entries for every live case, regenerates the case
# pages + unified docket + manifest, and commits — but ONLY when the docket
# content actually changed (fetch timestamps alone don't count), so quiet
# hours produce no commits and no rebuilds.

on:
  schedule:
    - cron: '23 * * * *'   # hourly — CL Individual membership tier (2026-07-30)
    # Nightly deep sync at 07:35 UTC (3:35 AM ET): re-pulls FULL docket
    # history (backfill mode) so richer document descriptions upgrade old
    # stub titles. Runs off-peak because CourtListener throttles GitHub's
    # shared runner IPs during US business hours — midday backfills starve
    # on 429s (proven 2026-08-04) while overnight runs pass consistently.
    - cron: '35 7 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-pull FULL docket history for every case (not just new entries)"
        required: false
        default: "false"
      case:
        description: "Sync ONLY this case slug (admin Sync-now button; ignores sync mode)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: docket-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pypdf + anthropic (upload text extraction and titling)
        run: pip install pypdf anthropic

      - name: Fetch dockets + regenerate case pages
        working-directory: briefing-generator
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DOCKET_BACKFILL: ${{ (github.event.inputs.backfill == 'true' || github.event.schedule == '35 7 * * *') && '1' || '' }}
          DOCKET_ONLY_CASE: ${{ github.event.inputs.case || '' }}
          # History trickle: each run walks this many older pages per case and
          # stores a resume cursor — full history accumulates across hourly
          # runs without ever tripping CourtListener's sustained-throttle wall.
          DOCKET_HISTORY_PAGES: "6"
        run: |
          python scripts/fetch_dockets.py
          python scripts/extract_uploads.py
          python scripts/inject_cases.py

      - name: Commit to main only if docket content changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Docket Sync Bot"
          # Ignore lines that change on every fetch (timestamps); if nothing
          # else changed in the data files, this run was a no-op for docket
          # content — CHANGED gates the dev mirror below, which only carries
          # real docket artifacts. Discard the regenerated noise either way,
          # but keep usage-log.json's fresh row: it's this run's own
          # CourtListener spend and would otherwise be lost on every quiet
          # hour (most of them) before ever reaching a commit.
          if git diff -I '"fetched_at":' -I '"as_of":' --exit-code -- briefing-generator/cases/data > /dev/null; then
            echo "No docket changes this hour"
            echo "CHANGED=0" >> "$GITHUB_ENV"
            git checkout -- briefing-generator ':!briefing-generator/usage-log.json'
          else
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi
          if git diff --quiet -- briefing-generator; then
            echo "Nothing to commit"
            exit 0
          fi
          git add briefing-generator
          git commit -m "Docket sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "pushed to main on attempt ${attempt}"; break
            fi
            # A conflicted rebase leaves unmerged files that doom every later
            # attempt ("Pulling is not possible") — reset before retrying.
            git rebase --abort 2>/dev/null || true
            echo "main push attempt ${attempt} failed; retrying in 5s"; sleep 5
          done

      # ── Mirror the refreshed artifacts to dev (same pattern as the daily
      # briefing workflow: artifacts only, never scripts/configs, so dev keeps
      # its own pipeline code which may be ahead of main). ──────────────────
      - name: Checkout dev branch
        if: env.CHANGED == '1'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy refreshed docket artifacts into dev
        if: env.CHANGED == '1'
        run: |
          mkdir -p dev-site/briefing-generator/cases/data
          cp -f briefing-generator/cases/data/*.json dev-site/briefing-generator/cases/data/ 2>/dev/null || true
          cp -f briefing-generator/cases/*.html dev-site/briefing-generator/cases/ 2>/dev/null || true
          cp -f briefing-generator/docket.html dev-site/briefing-generator/ 2>/dev/null || true
          cp -f briefing-generator/calendar.html dev-site/briefing-generator/ 2>/dev/null || true
          cp -f briefing-generator/news.html dev-site/briefing-generator/ 2>/dev/null || true
          cp -f briefing-generator/notes.html dev-site/briefing-generator/ 2>/dev/null || true
          cp -f briefing-generator/uploads.json dev-site/briefing-generator/ 2>/dev/null || true
          cp -rf briefing-generator/uploads dev-site/briefing-generator/ 2>/dev/null || true
          cp -f briefing-generator/usage-log.json dev-site/briefing-generator/ 2>/dev/null || true

      - name: Commit to dev
        if: env.CHANGED == '1'
        working-directory: dev-site
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Docket Sync Bot"
          git add briefing-generator
          if git diff --staged --quiet; then
            echo "Nothing new for dev"
          else
            git commit -m "Docket sync $(date -u +'%Y-%m-%d %H:%M UTC'): refresh dev"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin dev && git push origin HEAD:dev; then
                echo "pushed to dev on attempt ${attempt}"; break
              fi
              git rebase --abort 2>/dev/null || true
              echo "dev push attempt ${attempt} failed; retrying in 5s"; sleep 5
            done
          fi
