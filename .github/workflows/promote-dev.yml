# Auto-promote INTEL to production — hourly sync of briefing-generator/ from
# dev onto main, so news scans, docket syncs, intel notes, and case edits reach
# the live site on their own.
#
# Deliberately NOT a branch merge: admin/site content (src/, public/,
# functions/, …) stays staged on dev until Andrew's manual "Deploy to
# Production" (or the in-session Step 2 merge). Only the briefing-generator/
# tree is copied — exactly as it stands on dev, deletions included — so a
# pending admin draft never rides along.
name: Promote intel to production

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promote-dev
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync briefing-generator/ from dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          if git diff --quiet origin/dev HEAD -- briefing-generator/; then
            echo "intel already in sync — nothing to promote"
            exit 0
          fi
          # Replace main's briefing-generator/ with dev's exact tree (rm first
          # so files deleted on dev — e.g. removed cases — are deleted here too).
          git rm -r -q --ignore-unmatch -- briefing-generator/
          git checkout origin/dev -- briefing-generator/
          if git diff --cached --quiet; then
            echo "no staged intel changes after sync — done"
            exit 0
          fi
          git commit -m "Auto-promote intel: sync briefing-generator from dev"
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "intel promoted on attempt ${attempt}"
              exit 0
            fi
            echo "push attempt ${attempt} failed (main moved) — rebasing"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict — will retry next hour"; exit 1; }
            sleep 5
          done
          exit 1
