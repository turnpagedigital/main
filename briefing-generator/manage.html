<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/intel/assets/intel-favicon.png">
<title>Manage — Turnpage Intelligence</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"></noscript>
<style>
  :root {
    --bg: #F4F5F7; --surface: #FFFFFF; --paper-2: #ECEDEF;
    --ink: #0A0A0A; --ink-60: rgba(10,10,10,0.6); --ink-40: rgba(10,10,10,0.4); --ink-20: rgba(10,10,10,0.18);
    --line: rgba(10,10,10,0.08); --line-strong: rgba(10,10,10,0.14);
    --neon: #D4FF00; --neon-block: #D4FF00; --neon-on-block: #0A0A0A;
    --ok: #1a7f37; --warn: #9a6700; --danger: #c0392b;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D; --surface: #17171B; --paper-2: #17171B;
    --ink: #E5E7EB; --ink-60: rgba(229,231,235,0.62); --ink-40: rgba(229,231,235,0.42); --ink-20: rgba(229,231,235,0.18);
    --line: rgba(229,231,235,0.1); --line-strong: rgba(229,231,235,0.18);
    --neon-block: #D4FF00; --neon-on-block: #0A0A0A;
    --ok: #4cc38a; --warn: #d4a72c; --danger: #e5726a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Archivo', sans-serif; }
  body { line-height: 1.6; }

  /* Standard intel nav */
  .tn{background:#000;border-bottom:1px solid rgba(255,255,255,0.12);padding:10px 0;position:sticky;top:0;z-index:100;}
  .tn-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;max-width:1240px;margin:0 auto;padding:0 32px;}
  .tn-left{display:flex;align-items:center;gap:16px;}
  .tn-brand{display:inline-flex;align-items:center;padding:4px 0;text-decoration:none;}
  .tn-brand-logo{height:34px;width:auto;}
  .tn-logo-dark{display:none;}
  [data-theme="dark"] .tn-logo-light{display:none;}
  [data-theme="dark"] .tn-logo-dark{display:block;}
  .tn-back{color:rgba(255,255,255,0.72);font-size:12px;text-decoration:none;border-left:1px solid rgba(255,255,255,0.18);padding-left:16px;filter:grayscale(1);}
  .tn-back:hover,.tn-back.tn-on{color:#fff;font-weight:700;filter:none;}
  [data-theme="light"] .tn{background:#fff;border-bottom-color:rgba(10,10,10,0.08);}
  [data-theme="light"] .tn-back{color:rgba(10,10,10,0.6);border-left-color:rgba(10,10,10,0.14);}
  [data-theme="light"] .tn-back:hover,[data-theme="light"] .tn-back.tn-on{color:#0A0A0A;}
  #theme-toggle{background:transparent;border:1px solid rgba(255,255,255,0.25);border-radius:99px;padding:2px 8px;cursor:pointer;font-size:13px;font-family:inherit;line-height:1;color:#fff;margin-left:auto;}
  [data-theme="light"] #theme-toggle{border-color:rgba(10,10,10,0.14);color:#0A0A0A;}

  .mg-wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px 80px; }
  .mg-title { margin: 32px 0 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .mg-title h1 { font-size: clamp(1.4rem, 2.4vw, 1.9rem); font-weight: 800; letter-spacing: -0.02em; }
  .mg-title .mg-sub { font-size: 13px; color: var(--ink-60); }

  /* Press-style tab strip */
  .mg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 32px; }
  .mg-tab { font-family: inherit; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; height: 30px; padding: 0 14px; display: inline-flex; align-items: center; background: transparent; border: 1px solid var(--line-strong); color: var(--ink-60); cursor: pointer; text-decoration: none; transition: background .15s, color .15s, border-color .15s; }
  .mg-tab:hover { background: var(--paper-2); color: var(--ink); }
  .mg-tab.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  /* Panels, tables, forms */
  .mg-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .mg-head h2 { font-size: 15px; font-weight: 800; margin-right: auto; }
  .mg-hint { font-size: 12.5px; color: var(--ink-60); margin: -6px 0 16px; max-width: 760px; }
  .mg-box { background: var(--surface); border: 1px solid var(--line-strong); }
  .mg-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .mg-table th { text-align: left; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-40); padding: 10px 14px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .mg-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .mg-table tr:last-child td { border-bottom: none; }
  .mg-table tr:hover td { background: rgba(10,10,10,0.02); }
  [data-theme="dark"] .mg-table tr:hover td { background: rgba(229,231,235,0.04); }
  .mg-slug { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--ink-40); }
  .mg-right { text-align: right; white-space: nowrap; }
  .mg-empty { padding: 26px; color: var(--ink-60); font-size: 13.5px; }

  .mg-pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
  .mg-sync { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
  .mg-sync.active { color: var(--ok); } .mg-sync.manual { color: var(--warn); } .mg-sync.archived { color: var(--ink-40); }
  .mg-sync-select { appearance: none; -webkit-appearance: none; background: transparent; border: none; padding: 2px 14px 2px 0; margin: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 5px top 60%, right 1px top 60%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  .mg-sync-select:focus { outline: 2px solid var(--neon); outline-offset: 1px; }
  .mg-sync-select[disabled] { opacity: 0.5; cursor: default; background-image: none; }
  .mg-sync-select option { color: initial; text-transform: none; background: var(--bg); }

  .mg-btn { font-family: inherit; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; height: 28px; padding: 0 11px; display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--line-strong); color: var(--ink-60); cursor: pointer; text-decoration: none; transition: background .15s, color .15s, border-color .15s; }
  .mg-btn:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .mg-btn[disabled] { opacity: 0.4; pointer-events: none; }
  .mg-btn-primary { background: var(--neon-block); border-color: var(--neon-block); color: var(--neon-on-block); }
  .mg-btn-primary:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .mg-btn-danger { color: var(--danger); border-color: var(--danger); }
  .mg-btn-danger:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .mg-btn-ghost { border-color: transparent; }

  .mg-banner { padding: 10px 14px; font-size: 13px; margin-bottom: 14px; border: 1px solid; }
  .mg-banner.err { color: var(--danger); border-color: var(--danger); background: rgba(192,57,43,0.06); }
  .mg-banner.ok { color: var(--ok); border-color: var(--ok); background: rgba(26,127,55,0.06); }
  .mg-banner.warn { color: var(--warn); border-color: var(--warn); background: rgba(154,103,0,0.06); }

  .mg-form { background: var(--surface); border: 1px solid var(--line-strong); padding: 22px; margin-bottom: 40px; }
  .mg-form h3 { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-40); margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .mg-form h3:first-child { margin-top: 0; }
  .mg-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mg-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .mg-grid2, .mg-grid3 { grid-template-columns: 1fr; } }
  .mg-field { margin-bottom: 12px; }
  .mg-field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-60); margin-bottom: 4px; }
  .mg-field input[type="text"], .mg-field input[type="url"], .mg-field select, .mg-field textarea {
    width: 100%; font-family: inherit; font-size: 13.5px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); padding: 8px 10px; outline: none;
  }
  .mg-field input:focus, .mg-field select:focus, .mg-field textarea:focus { outline: 2px solid var(--neon); outline-offset: 1px; }
  .mg-field textarea { min-height: 110px; resize: vertical; }
  .mg-field .mg-note { font-size: 11.5px; color: var(--ink-40); margin-top: 4px; }
  .mg-check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; padding: 7px 10px; border: 1px solid var(--line); }
  .mg-check input { accent-color: var(--neon-block); width: 14px; height: 14px; }
  .mg-check.on { border-color: var(--ink); background: var(--paper-2); }
  .mg-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .mg-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .mg-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line-strong); padding: 3px 8px; }
  .mg-chip button { background: none; border: none; cursor: pointer; color: var(--ink-40); font-size: 12px; padding: 0; line-height: 1; }
  .mg-chip button:hover { color: var(--danger); }

  /* Briefing Inputs tab — everything that feeds a case/group briefing prompt,
     gathered in one place. */
  .mg-bi-section { margin-bottom: 28px; }
  .mg-bi-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .mg-bi-section-head h3 { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-60); margin: 0; }
  .mg-bi-voice-preview { padding: 14px; font-size: 12.5px; line-height: 1.6; color: var(--ink-60); white-space: pre-wrap; max-height: 140px; overflow: hidden; position: relative; }
  .mg-bi-voice-preview::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--surface)); }
  .mg-bi-rows { display: flex; flex-direction: column; gap: 8px; }
  .mg-bi-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: var(--surface); border: 1px solid var(--line); }
  .mg-bi-case { flex: 0 0 160px; padding-top: 6px; }
  .mg-bi-guidance { flex: 1; min-height: 44px; font-family: inherit; font-size: 12.5px; line-height: 1.5; padding: 7px 9px; background: var(--paper-2); border: 1px solid var(--line-strong); color: var(--ink); outline: none; resize: vertical; box-sizing: border-box; }
  .mg-bi-guidance:focus { outline: 2px solid var(--neon); outline-offset: 1px; }
  .mg-bi-row .mg-btn { flex: 0 0 auto; margin-top: 3px; }

  /* Briefing groups editor — cases briefed together as one unit. */
  .mg-bi-grp-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 12.5px; }
  .mg-bi-grp-del { background: none; border: none; color: var(--ink-40); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .mg-bi-grp-del:hover { color: #C84141; }
  .mg-bi-grp-new { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .mg-bi-grp-name { width: 100%; max-width: 360px; margin-bottom: 10px; }
  .mg-bi-grp-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 14px; max-height: 220px; overflow-y: auto; margin-bottom: 10px; }
  .mg-bi-grp-check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink); cursor: pointer; }
  .mg-bi-grp-check input { accent-color: var(--neon-block); margin: 0; }
  .mg-bi-grp-check.taken { color: var(--ink-40); cursor: default; }
  .mg-bi-grp-foot { display: flex; align-items: center; gap: 10px; }

  /* News feed sources — relocated here from the docket/news toolbar. */
  .ud-src-list { display: flex; flex-direction: column; gap: 6px; }
  .ud-src-row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; background: var(--paper-2); border: 1px solid var(--line); }
  .ud-src-row input[type="checkbox"] { accent-color: var(--neon-block); margin: 0; flex-shrink: 0; }
  .ud-src-name { font-weight: 700; flex: 0 0 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ud-src-url { flex: 1; font-size: 12px; color: var(--ink-60); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ud-src-kind { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 1px 7px; flex-shrink: 0; }
  .ud-src-del { background: none; border: none; color: var(--ink-40); font-size: 15px; cursor: pointer; padding: 0 3px; }
  .ud-src-del:hover { color: var(--danger); }
  .ud-src-add { display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; flex-wrap: wrap; }
  .ud-src-add input { font-family: inherit; font-size: 12.5px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); outline: none; }
  .ud-src-add input:focus { outline: 2px solid var(--neon); outline-offset: 1px; }
  .ud-src-mode { font-family: inherit; font-size: 11.5px; padding: 4px 5px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }

  /* Settings palette */
  .mg-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .mg-sw { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); padding: 10px; background: var(--surface); }
  .mg-sw-preview { width: 52px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border-radius: 99px; flex: none; }
  .mg-sw label { font-size: 10.5px; color: var(--ink-60); display: flex; align-items: center; gap: 5px; }
  .mg-sw input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line-strong); background: none; padding: 0; cursor: pointer; }

  /* Row color-picker popover */
  .mg-gear { background: none; border: none; cursor: pointer; color: var(--ink-40); font-size: 17px; padding: 0 4px; line-height: 1; vertical-align: middle; }
  .mg-gear:hover { color: var(--ink); }
  .mg-pop { position: absolute; z-index: 300; width: 264px; background: var(--surface); border: 1px solid var(--ink); box-shadow: 0 14px 40px rgba(10,10,10,0.22); padding: 14px; }
  [data-theme="dark"] .mg-pop { border-color: var(--line-strong); box-shadow: 0 14px 40px rgba(0,0,0,0.55); }
  .mg-pop-title { font-size: 12px; font-weight: 800; margin-bottom: 10px; }
  .mg-pop-sws { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
  .mg-pop-sw { width: 100%; aspect-ratio: 1; border: 1px solid var(--line-strong); cursor: pointer; padding: 0; }
  .mg-pop-sw.on { outline: 2px solid var(--ink); outline-offset: 1px; }
  .mg-pop-row { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-60); margin-bottom: 8px; }
  .mg-pop-row input[type="color"] { width: 30px; height: 24px; border: 1px solid var(--line-strong); background: none; padding: 0; cursor: pointer; }
  .mg-pop-reset { margin-top: 4px; }

  /* Login overlay */
  .mg-login { position: fixed; inset: 0; background: rgba(10,10,10,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
  .mg-login-card { background: var(--surface); border: 1px solid var(--ink); padding: 26px; width: 360px; max-width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,0.3); }
  .mg-login-card h2 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .mg-login-card p { font-size: 12.5px; color: var(--ink-60); margin-bottom: 14px; }

  /* Confirm modal */
  .mg-modal { position: fixed; inset: 0; background: rgba(10,10,10,0.5); display: flex; align-items: center; justify-content: center; z-index: 400; padding: 16px; }
  .mg-modal-card { background: var(--surface); border: 1px solid var(--ink); padding: 22px; width: 440px; max-width: 100%; font-size: 13.5px; }
</style>
<!-- AUTH GATE START -->
<!-- AUTH GATE END -->
</head>
<body>

<nav class="tn">
  <div class="tn-row">
    <div class="tn-left">
      <a class="tn-brand" href="index.html"><img class="tn-brand-logo tn-logo-light" alt="Turnpage Intelligence" src="assets/turnpage-intel-logo.png"><img class="tn-brand-logo tn-logo-dark" alt="Turnpage Intelligence" src="assets/turnpage-intel-logo-dark.png"></a>
      <a class="tn-back" href="index.html">🏠 Dashboard</a>
      <a class="tn-back" href="docket.html">⚖️ Docket</a>
      <a class="tn-back" href="calendar.html">📅 Calendar</a>
      <a class="tn-back" href="notes.html">🗒️ Notes</a>
      <a class="tn-back" href="news.html">📡 News</a>
      <a class="tn-back" href="prospects.html">🔭 Prospects</a>
    </div>
    <div class="tn-gear" id="tn-gear"><button type="button" class="tn-gear-btn" id="tn-gear-btn" title="Settings" aria-haspopup="true">⚙️</button><div class="tn-gear-panel"><a href="manage.html#cases">Cases</a><a href="manage.html#themes">Themes</a><a href="manage.html#groups">Groups</a><a href="manage.html#voice">Voice</a><a href="manage.html#colors">Colors</a></div></div><button id="theme-toggle">🖥️</button>
  </div>
</nav>

<div class="mg-wrap">
  <div class="mg-title">
    <h1>⚙️ Manage</h1>
    <span class="mg-sub">Cases, themes, filter groups, and intelligence settings — changes commit to the repo like any admin save.</span>
  </div>

  <div class="mg-tabs" id="mg-tabs">
    <a class="mg-tab" href="#cases" data-tab="cases">Cases</a>
    <a class="mg-tab" href="#themes" data-tab="themes">Themes</a>

  </div>

  <div id="mg-root"><div class="mg-empty">Loading…</div></div>
</div>

<script src="manage.js" defer></script>
<footer id="tn-site-footer"></footer>
