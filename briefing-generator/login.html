<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Turnpage Daily Briefing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF; --surface: #FFFFFF; --ink: #0A0A0A;
      --ink-60: rgba(10,10,10,0.6); --line: rgba(10,10,10,0.14);
      --neon: #D4FF00;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: 'Archivo', sans-serif; background: var(--bg); color: var(--ink); }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .login-card { max-width: 420px; width: 100%; padding: 48px 40px; border: 1px solid var(--line); background: var(--surface); }
    .brand { font-weight: 800; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 32px; }
    h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 12px; }
    .sub { font-size: 14px; color: var(--ink-60); margin-bottom: 32px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 8px; }
    input[type=email] { width: 100%; padding: 14px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: inherit; font-size: 15px; outline: none; border-radius: 0; }
    input[type=email]:focus { border-color: var(--ink); }
    button { width: 100%; margin-top: 20px; padding: 14px 24px; background: var(--ink); color: #FFFFFF; border: 1px solid var(--ink); font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; border-radius: 0; }
    button:hover { background: var(--neon); color: var(--ink); border-color: var(--neon); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 20px; padding: 12px; font-size: 13px; line-height: 1.5; }
    .msg.success { background: var(--neon); color: var(--ink); }
    .msg.error { background: rgba(200,65,65,0.1); color: #C84141; border: 1px solid #C84141; }
    .footer { margin-top: 40px; font-size: 11px; color: var(--ink-60); letter-spacing: 0.04em; }
  </style>
  <script src="/auth/config.js"></script>
</head>
<body>
  <div class="login-card">
    <div class="brand">Turnpage Digital Markets</div>
    <h1>Daily Briefing</h1>
    <p class="sub">Sign in with your email. We'll send you a one-time link.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@turnpagedigital.com" required autofocus>
      <button type="submit" id="submit-btn">Send magic link →</button>
      <div id="msg"></div>
    </form>
    <div class="footer">Authorized readers only. Magic link expires in 1 hour.</div>
  </div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const cfg = window.SUPABASE_CONFIG;
    const supabase = createClient(cfg.url, cfg.anonKey);

    // If already signed in, redirect to the return URL or home
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const params = new URLSearchParams(window.location.search);
      const ret = params.get("return") || "/";
      window.location.replace(ret);
    }

    // Handle ?error=unauthorized
    const params = new URLSearchParams(window.location.search);
    if (params.get("error") === "unauthorized") {
      document.getElementById("msg").innerHTML = '<div class="msg error">That email is not authorized to read this briefing.</div>';
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.toLowerCase().trim();
      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("msg");

      // Client-side allow-list check (server-side RLS enforces it too)
      if (cfg.allowedEmails.length && !cfg.allowedEmails.map(e => e.toLowerCase()).includes(email)) {
        msg.innerHTML = '<div class="msg error">That email is not authorized.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending…";

      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("return") || "/";

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin + returnTo,
        },
      });

      if (error) {
        msg.innerHTML = `<div class="msg error">${error.message}</div>`;
        btn.disabled = false;
        btn.textContent = "Send magic link →";
      } else {
        msg.innerHTML = '<div class="msg success">Check your email. Link expires in 1 hour.</div>';
      }
    });
  </script>
</body>
</html>
