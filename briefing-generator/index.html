<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/intel/assets/intel-favicon.png">
  <title>Dashboard — Turnpage Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF; --surface: #FFFFFF; --paper-2: #F4F5F7;
      --ink: #0A0A0A; --ink-60: rgba(10,10,10,0.6); --ink-40: rgba(10,10,10,0.4); --ink-20: rgba(10,10,10,0.18);
      --line: rgba(10,10,10,0.08); --line-strong: rgba(10,10,10,0.14);
      --neon: #D4FF00; --neon-block: #D4FF00; --neon-on-block: #0A0A0A;
    }
    [data-theme="dark"] {
      --bg: #16161B; --surface: #1F1F25; --paper-2: #1F1F25;
      --ink: #E5E7EB; --ink-60: rgba(229,231,235,0.62); --ink-40: rgba(229,231,235,0.42); --ink-20: rgba(229,231,235,0.18);
      --line: rgba(229,231,235,0.1); --line-strong: rgba(229,231,235,0.18);
      --neon-block: #5D7A00 !important; --neon-on-block: #FFFFFF !important;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--ink); font-family: 'Archivo', sans-serif; }
    body { line-height: 1.72; }

    /* Brand strip */
    .tn-row.brand { max-width: 1440px; margin: 0 auto; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
    .tn-brand-logo { height: 36px; }
    [data-theme="light"] .tn-brand-logo { filter: none; }
    [data-theme="dark"] .tn-brand-logo { filter: invert(1); }
    #theme-toggle { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px; }

    /* Topic tabs row */
    .tn-tabs-row { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
    .tn-tab { position: relative; }
    .tn-pill { padding: 9px 18px; font-size: 14.5px; font-weight: 600; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; border-radius: 0; font-family: 'Archivo', sans-serif; }
    .tn-pill.active { background: var(--neon-block); color: var(--neon-on-block); border: 1px solid var(--neon-block); font-weight: 700; pointer-events: none; }
    .tn-pill:hover { background: var(--neon-block) !important; color: var(--neon-on-block) !important; border: 1px solid var(--neon-block) !important; font-weight: 700 !important; }
    .tn-tabs-row:has(.tn-tab:hover) .tn-tab.active:not(:hover) .tn-pill.active {
      background: rgba(10,10,10,0.06) !important;
      color: rgba(10,10,10,0.55) !important;
      border: 1px solid transparent !important;
      font-weight: 600 !important;
    }
    [data-theme="dark"] .tn-tabs-row:has(.tn-tab:hover) .tn-tab.active:not(:hover) .tn-pill.active {
      background: rgba(229,231,235,0.08) !important;
      color: rgba(229,231,235,0.55) !important;
    }

    /* Hover dropdown */
    .tn-dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: -10px; background: var(--neon-block); color: var(--neon-on-block); opacity: 0; visibility: hidden; z-index: 100; }
    .tn-tab:hover .tn-dropdown { opacity: 1; visibility: visible; }
    .tn-tab { padding-bottom: 12px; margin-bottom: -12px; }

    .tn-dd-inner { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; padding: 24px 32px; max-width: 1440px; margin: 0 auto; }
    .tn-dd-col-overview { }
    .tn-dd-eyebrow { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 8px; color: inherit; opacity: 0.8; }
    .tn-dd-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .tn-dd-body { font-size: 14px; line-height: 1.6; }
    .tn-dd-list { list-style: none; padding: 0; }
    .tn-dd-link { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; padding: 8px 0; font-size: 14px; font-weight: 600; border-bottom: 1px solid rgba(10,10,10,0.1); }
    .tn-dd-link:last-child { border-bottom: none; }
    .tn-dd-link span { flex: 1; }
    .tn-dd-cta { display: inline-block; background: var(--neon-on-block); color: var(--neon-block); padding: 12px 20px; text-decoration: none; font-weight: 700; font-size: 14px; border-radius: 0; align-self: flex-start; }
    .tn-dd-cta:hover { opacity: 0.9; }

    /* Page title */
    .page-title { max-width: 1440px; margin: 32px auto 24px; padding: 0 32px; border-bottom: 2px solid var(--ink); padding-bottom: 24px; }
    .page-title h1 { font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .stamp { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-60); }

    /* Calendar strip */
    .calendar-strip { max-width: 1440px; margin: 0 auto 32px; padding: 0 32px; }
    .cal-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-60); margin-bottom: 16px; }
    .cal-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .cal-square { width: 56px; height: 56px; background: white; border: 1px solid var(--line-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
    [data-theme="dark"] .cal-square { background: var(--surface); }
    .cal-month { font-size: 0.65rem; font-weight: 700; color: var(--ink-60); letter-spacing: 0.04em; }
    .cal-day { font-size: 22px; font-weight: 900; position: relative; padding-bottom: 4px; }
    .cal-day::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: var(--neon-block); }

    /* Topic cards grid */
    .card-grid { max-width: 1440px; margin: 0 auto 48px; padding: 0 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .card { background: var(--surface); border: 1px solid var(--line-strong); padding: 24px; }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .card-emoji { font-size: 32px; }
    .card-title { font-size: 18px; font-weight: 700; }
    .card-stat { background: var(--neon-block); color: var(--neon-on-block); padding: 8px 12px; font-size: 14px; font-weight: 700; display: inline-block; margin: 16px 0; }
    .card-body { font-size: 14px; line-height: 1.6; color: var(--ink-60); margin: 16px 0; }
    .card-link { display: inline-block; margin-top: 16px; padding: 8px 16px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 14px; border-radius: 0; border: 1px solid var(--ink); }
    .card-link:hover { background: transparent; color: var(--ink); }

    /* Market watch sidebar */
    .market-watch { max-width: 1440px; margin: 0 auto 48px; padding: 0 32px; }
    .box { background: var(--surface); border: 1px solid var(--line-strong); padding: 16px 18px; }
    .box h2 { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 12px; color: var(--ink); }
    .tk-list { display: flex; flex-direction: column; gap: 8px; }
    .tk-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; font-size: 12.5px; }
    .tk-row:last-child { border-bottom: none; }
    .tk-sym { font-weight: 800; letter-spacing: 0.02em; }
    .tk-name { color: var(--ink-60); font-size: 10.5px; }
    .tk-price { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .tk-change { font-size: 10.5px; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
    .tk-up { color: #2D8E47; }
    .tk-down { color: #C84141; }
    [data-theme="dark"] .tk-up { color: #54C277; }
    [data-theme="dark"] .tk-down { color: #E07474; }
    /* Dashboard columns */
    .ih-grid { max-width: 1440px; margin: 0 auto 48px; padding: 0 32px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 1080px) { .ih-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) { .ih-grid { grid-template-columns: 1fr; } }
    .ih-col { background: var(--surface); border: 1px solid var(--line-strong); display: flex; flex-direction: column; }
    .ih-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line-strong); text-decoration: none; color: inherit; }
    .ih-emoji { font-size: 17px; }
    .ih-name { font-size: 14px; font-weight: 800; }
    .ih-more { margin-left: auto; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .ih-list { display: flex; flex-direction: column; }
    .ih-row { display: block; padding: 9px 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
    .ih-row:last-child { border-bottom: none; }
    .ih-row:hover { background: rgba(10,10,10,0.03); }
    [data-theme="dark"] .ih-row:hover { background: rgba(229,231,235,0.05); }
    .ih-date { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--ink-60); text-transform: uppercase; margin-bottom: 2px; }
    .ih-text { font-size: 12.5px; line-height: 1.45; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ih-empty { padding: 12px 14px; font-size: 12px; color: var(--ink-60); }

  /* DARK-MODE HIGHLIGHTER START */
:root {
  --neon-block: #D4FF00;
  --neon-on-block: #0A0A0A;
}
[data-theme="light"] {
  --neon-block: #D4FF00 !important;
  --neon-on-block: #0A0A0A !important;
}
[data-theme="dark"] {
  --neon-block: #5D7A00 !important;
  --neon-on-block: #FFFFFF !important;
}
[data-theme="dark"] .stat-anchor,
[data-theme="dark"] .anchor-stat,
[data-theme="dark"] .stat-callout,
[data-theme="dark"] .lead-headline .accent,
[data-theme="dark"] h1 .accent,
[data-theme="dark"] .accent,
[data-theme="dark"] .card-stat-anchor,
[data-theme="dark"] .stat-anchor-value {
  background: var(--neon-block) !important;
  color: var(--neon-on-block) !important;
}
[data-theme="dark"] .cal-day {
  background: linear-gradient(180deg, transparent 0 60%, #5D7A00 60% 96%, transparent 96%) !important;
  color: #FFFFFF !important;
}
/* DARK-MODE HIGHLIGHTER END */

    /* Unified 60-day calendar strip */
    .unified-calendar { max-width: 1440px; margin: 0 auto 24px; padding: 0 32px; }
      padding: 12px 14px; text-decoration: none; color: inherit; display: flex; gap: 12px; align-items: center;
      transition: background 0.15s, border-color 0.15s, transform 0.15s; }
      width: 50px; height: 50px; background: #FFFFFF; border: 1px solid rgba(10,10,10,0.14);
      padding-top: 4px; flex-shrink: 0; box-sizing: border-box; }
      background: linear-gradient(180deg, transparent 0 65%, var(--neon-block) 65% 95%, transparent 95%);
      color: var(--ink); padding: 0 3px; }
      display: flex; gap: 6px; align-items: baseline; }

</style>
